[package]
name = "addrsearch"
version = "0.1.0"
edition = "2024"

[profile.release]
lto=true
strip=true
codegen-units=1

[dependencies]
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
urlencoding = "2.1"
reqwest = { version = "0.13", features = ["brotli", "deflate", "gzip", "json", "stream", "zstd", "query"] }
